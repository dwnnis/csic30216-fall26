# ─────────────────────────────────────────────────────────────
# Assignments — individual graded work
# ─────────────────────────────────────────────────────────────

- id: "A1"
  title: "Technique Practice and Prompt Diagnosis"
  weight: "10%"
  due: "Week 5 — Oct 5, start of class"
  url: ""
  description: "Part 1: practice five prompting techniques on a code generation task. Part 2: diagnose and rewrite three provided broken prompts."

- id: "A3"
  title: "Prompt System Design and Test Suite"
  weight: "15%"
  due: "Week 11 — Nov 16, start of class"
  url: ""
  description: "Part A: design a complete prompt system for one of three engineering scenarios. Part B: build a 10-case PromptFoo test suite, fix the most important failure, and analyse what testing revealed."

- id: "A5"
  title: "Engineering Decision Portfolio"
  weight: "10%"
  due: "Week 15 — Dec 14, start of class"
  url: ""
  description: "Three decision entries with actual artifacts. Span constraint: at least one from A1 or A3, one from the project, one from Weeks 9–15. At least one entry must involve overriding or correcting AI output."

- id: "Essay"
  title: "Individual Reflection Essay"
  weight: "8%"
  due: "Within 48h of Week 16 class"
  url: ""
  description: "400–500 words with actual prompt examples. Must include at least one moment of evaluating and overriding AI output. Review your prompt engineering log before writing."

- id: "Peer"
  title: "Peer Evaluation of Collaboration"
  weight: "2%"
  due: "Within 48h of Week 16 class"
  url: ""
  description: "Evaluate your three teammates on observable collaboration behaviours: substantive code contributions and genuine code steward engagement. Anonymous, submitted once at CP3."

- id: "Surveys"
  title: "Check-in Surveys (4 surveys)"
  weight: "3%"
  due: "Baseline Wk 1 | T1 Wk 9 | T2 Wk 13 | Post Wk 16"
  url: ""
  description: "Four course experience check-ins across the semester. Graded on completion. Individual responses are not shared with instructors during the semester."
