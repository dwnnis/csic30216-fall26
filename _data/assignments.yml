- id: "A1"
  number: 1
  slug: "a1"
  title: "Technique Practice and Prompt Diagnosis"
  weight: "10%"
  due: "Week 5 — Oct 5, start of class"
  description: "This assignment consists of two parts: practicing multiple prompting techniques to generate codes, and diagnose and rewrite \"broken\" prompts. The core question to address through finishing this assignment is: \"can you use prompting techniques on purpose, and can you recognise when they are failing?\""
  # "Part 1: practice five prompting techniques on a code generation task. Part 2: diagnose and rewrite three provided broken prompts."

- id: "A2"
  number: 2
  slug: ""
  title: "Prompt System Design and Test Suite"
  weight: "15%"
  due: "Week 11 — Nov 16, start of class"
  description: "This two-part assignment requires you to design a complete prompt system for several engineering scenarios, and build test suites, resolve failures, and analyze the test outcomes. The goal is to move from \"this prompt works on the examples I tried\" to \"I have evidence this prompt works reliably.\""
  # "Part A: design a complete prompt system for one of three engineering scenarios. Part B: build a 10-case PromptFoo test suite, fix the most important failure, and analyse what testing revealed."

- id: "A3"
  number: 3
  slug: ""
  title: "Engineering Decision Portfolio"
  weight: "10%"
  due: "Week 15 — Dec 14, start of class"
  description: "This is a assignment that asks you to reflect on the engineering decisions you made during the semester. The decisions can come from assignments, the project, or your own independent AI use. You will need actual artifacts (e.g., the prompt, test case(s),  paragraph(s) from your DECISIONS.md, PR comment, or code snippet) to supplement your writings."
  # "Three decision entries with actual artifacts. Span constraint: at least one from A1 or A3, one from the project, one from Weeks 9–15. At least one entry must involve overriding or correcting AI output."

